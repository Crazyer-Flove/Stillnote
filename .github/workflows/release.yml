name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run desktop:build
      - name: Smoke-test portable application
        shell: pwsh
        run: |
          $exe = (Get-ChildItem release/*-Portable.exe).FullName
          $report = Join-Path $env:RUNNER_TEMP 'stillnote-smoke'
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test-dir=$report" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { throw 'Application did not finish diagnostics' }
          $result = Get-Content (Join-Path $report 'result.json') | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged application diagnostics failed' }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$hash  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = (Get-ChildItem release/*.exe).FullName
          $notes = "docs/releases/$($env:GITHUB_REF_NAME).md"
          gh release create $env:GITHUB_REF_NAME @assets release/SHA256SUMS.txt --title "Stillnote $env:GITHUB_REF_NAME" --notes-file $notes --verify-tag
